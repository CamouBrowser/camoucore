name: release

# A v<version> tag publishes camoucore at that version to PyPI and npm: the
# core, every launcher (camoucore.<launcher>, camoucore/<launcher>) and, on
# npm, the MCP server. Each launcher's own browser-pin.json inside it is
# stamped with the browser release the tests below ran it against: what it
# fetches when the browser repository's <launcher> package, whose pin wins, is
# not installed.
#
# Publishing is OIDC trusted publishing with provenance; RELEASING.md lists the
# trusted publishers this needs. Re-running a release skips what is already
# published, so a run that failed half way can be re-run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    name: Build the package
    needs: tests
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # build provenance attestations
      attestations: write
    outputs:
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/node
      - id: version
        name: The tag is the version the package carries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/set-version.py --check
          version=$(jq -r .version typescript/camoucore/package.json)
          [ "v$version" = "$TAG" ] || { echo "::error::$TAG does not match the package's version $version"; exit 1; }
          case "$version" in *-*) echo "npm-tag=next" ;; *) echo "npm-tag=latest" ;; esac >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tested-browser-*
          path: .ci-work/tested
          merge-multiple: true
      - name: Stamp each launcher's fallback pin with the browser it was tested on
        run: |
          launchers=$(cd python/camoucore/src/camoucore && ls -d */repos.yml | cut -d/ -f1)
          [ -n "$launchers" ] || { echo "::error::no launcher found to stamp"; exit 1; }
          for launcher in $launchers; do
            f=.ci-work/tested/$launcher.json
            [ -f "$f" ] || { echo "::error::no tested browser recorded for $launcher"; exit 1; }
            python3 scripts/browser-release.py stamp "$launcher" --repo "$(jq -r .repo "$f")" --tag "$(jq -r .tag "$f")"
          done
      - name: Build the Python package
        run: |
          python3 -m pip install -q build twine
          python3 -m build python/camoucore --outdir python-dist
          python3 -m twine check --strict python-dist/*
      - name: Every launcher's stamped pin is in the wheel
        run: |
          for launcher in $(cd python/camoucore/src/camoucore && ls -d */repos.yml | cut -d/ -f1); do
            unzip -p python-dist/*.whl "camoucore/$launcher/browser-pin.json" | jq -e .tag >/dev/null \
              || { echo "::error::the wheel's camoucore/$launcher/browser-pin.json is not stamped"; exit 1; }
          done
      - name: Build the npm package
        # The build copies the stamped pins in with the other data files.
        run: |
          mkdir npm-dist
          cd typescript/camoucore
          pnpm run build
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/npm-dist"
          ls "$GITHUB_WORKSPACE/npm-dist"
      - name: Every launcher's stamped pin is in the tarball
        run: |
          for launcher in $(cd python/camoucore/src/camoucore && ls -d */repos.yml | cut -d/ -f1); do
            tar -xOzf npm-dist/camoucore-*.tgz "package/dist/$launcher/data-files/browser-pin.json" | jq -e .tag >/dev/null \
              || { echo "::error::the tarball's dist/$launcher/data-files/browser-pin.json is not stamped"; exit 1; }
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            python-dist/*
            npm-dist/*.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: python-dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-dist
          path: npm-dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # trusted publishing; the action also uploads PEP 740 attestations
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  publish-npm:
    name: Publish to npm
    # After PyPI, so npm never has a version PyPI does not.
    needs: [build, publish-pypi]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Trusted publishing needs npm >= 11.5.1, which Node 24 ships.
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-dist
          path: npm-dist
      - env:
          NPM_TAG: ${{ needs.build.outputs.npm-tag }}
        run: |
          for tgz in npm-dist/*.tgz; do
            spec=$(tar -xOzf "$tgz" package/package.json | jq -r '.name + "@" + .version')
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already published"; continue
            fi
            # `./` keeps npm from reading the path as a GitHub owner/repo.
            npm publish "./$tgz" --access public --provenance --tag "$NPM_TAG"
          done
