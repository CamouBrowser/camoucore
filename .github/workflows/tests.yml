name: tests

# The camoucore package in both languages, suite by suite (the core, each
# launcher, the MCP server), and each launcher against its newest browser
# release. The browser ships
# first, then the driver: a driver change that needs a browser change waits for
# that browser's release, and the integration job says so by failing until it
# exists.
#
# The launchers are found, not listed: every subpackage of camoucore with a
# repos.yml (AGENTS.md, "Adding a launcher").
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    outputs:
      launchers: ${{ steps.launchers.outputs.launchers }}
      suites: ${{ steps.launchers.outputs.suites }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The oldest Python the packages support (python = "^3.11").
          python-version: "3.11"
      - id: launchers
        run: |
          launchers=$(cd python/camoucore/src/camoucore && ls -d */repos.yml | cut -d/ -f1 | jq -R . | jq -cs .)
          [ "$launchers" != "[]" ] || { echo "::error::no launcher (a subpackage with repos.yml) in python/camoucore/src/camoucore"; exit 1; }
          echo "launchers=$launchers" >> "$GITHUB_OUTPUT"
          echo "suites=$(jq -c '["core"] + .' <<<"$launchers")" >> "$GITHUB_OUTPUT"
          echo "launchers: $launchers"
      - name: Every version file is at one version
        run: python3 scripts/set-version.py --check
      - name: The sources compile on the oldest supported Python
        run: python3 -m compileall -q python/camoucore/src
      - name: No test input is git-ignored
        run: scripts/check-test-inputs.sh

  python:
    name: Python ${{ matrix.suite }}
    needs: static
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.static.outputs.suites) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test prerequisites
        # xvfb: the virtual-display lifecycle tests start servers of their own.
        run: command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb; }
      # Every extra the package declares (geoip: the GeoIP source tests
      # download every source and fail when one stops publishing). Into a
      # fresh venv: a self-hosted runner keeps setup-python's interpreter across
      # jobs, and a package another job installed there non-editable (the
      # integration job's camoucore) would shadow this checkout's.
      - run: |
          extras=$(python3 -c 'import tomllib; print(",".join(tomllib.load(open("python/camoucore/pyproject.toml", "rb"))["tool"]["poetry"].get("extras", {})))')
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -q -r python/requirements-dev.txt -e "python/camoucore[$extras]"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/fpgen-model
      - name: pytest
        working-directory: python/camoucore
        env:
          # The drivers resolve releases through the GitHub API; anonymous, a
          # runner shares its IP range's 60-an-hour quota.
          GITHUB_TOKEN: ${{ github.token }}
        # A private display: nothing in the suite can reach a desktop. One
        # suite per run: each imports its helpers by bare name.
        run: xvfb-run -a python3 -m pytest "tests/${{ matrix.suite }}" -q

  typescript:
    name: TypeScript ${{ matrix.suite }}
    needs: static
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.static.outputs.suites) }}
    env:
      SUITE: ${{ matrix.suite }}
    defaults:
      run:
        working-directory: typescript/camoucore
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The golden tests hold each TypeScript suite to its Python twin's
          # output, recorded from this interpreter (<LAUNCHER>_PYTHON).
          python-version: "3.14"
      - name: The Python twin, for the goldens
        working-directory: .
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r python/requirements-dev.txt -e python/camoucore
          prefix=$([ "$SUITE" = core ] && echo CAMOUCORE || echo "${SUITE^^}")
          echo "${prefix}_PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
      - uses: ./.github/actions/fpgen-model
        with:
          python: .venv/bin/python
      - name: Test prerequisites
        run: command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb; }
      - uses: ./.github/actions/node
      # The whole package, once: these do not split by suite.
      - name: Type check
        if: matrix.suite == 'core'
        run: pnpm typecheck
      - name: Lint
        if: matrix.suite == 'core'
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: The packed tarball installs, imports, ships every data file and runs as each wrapper
        if: matrix.suite == 'core'
        run: pnpm check:pack
      - name: The recorded goldens match the Python launcher
        run: |
          if ! jq -e --arg s "golden:$SUITE" '.scripts[$s]' package.json >/dev/null; then echo "$SUITE records no goldens"; exit 0; fi
          pnpm "golden:$SUITE"
          git diff --exit-code -- "tests/$SUITE/golden" || {
            echo "::error::typescript/camoucore/tests/$SUITE/golden is stale: the Python launcher's output changed. Run pnpm golden:$SUITE and commit, or mirror the change in TypeScript."
            exit 1
          }
      - name: vitest (golden tests included)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WAYLAND_DISPLAY: ""
        run: xvfb-run -a pnpm exec vitest run --project "$SUITE"

  mcp:
    name: MCP server
    needs: static
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/node
      - working-directory: typescript/camoucore
        env:
          # The real-browser half runs in the integration job, which has a browser.
          CAMOUCORE_TEST_ALLOW_MISSING: CAMOUCORE_MCP_LAUNCHER
        run: pnpm test:mcp

  install-driver:
    name: install-driver.sh ${{ matrix.launcher }}
    # What a browser repository's CI runs when its ci/driver-ref names a ref.
    needs: static
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        launcher: ${{ fromJSON(needs.static.outputs.launchers) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/node
      # The browser repositories call it with an npm directory even from a
      # Python-only job, and with or without extras.
      - name: Python and npm, with extras
        run: scripts/install-driver.sh ${{ matrix.launcher }} "$RUNNER_TEMP/venv" "$RUNNER_TEMP/npm" geoip
      - name: Python and npm, no extras
        run: scripts/install-driver.sh ${{ matrix.launcher }} "$RUNNER_TEMP/venv2" "$RUNNER_TEMP/npm2"
      - name: Python only, given an npm directory on a machine without node
        run: |
          python_dir=$(dirname "$(readlink -f "$(command -v python3)")")
          export PATH="$python_dir:/usr/bin:/bin"
          if command -v node; then echo "::error::node is still on PATH; this step tests a machine without it"; exit 1; fi
          scripts/install-driver.sh ${{ matrix.launcher }} "$RUNNER_TEMP/venv3" "$RUNNER_TEMP/npm3" | tee out.txt
          grep -q 'node is not on PATH' out.txt
          [ ! -e "$RUNNER_TEMP/npm3/node_modules" ]

  # -------------------------------------------------------------------------
  integration:
    name: ${{ matrix.launcher }} on its newest browser
    needs: [static, python, typescript, mcp]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        launcher: ${{ fromJSON(needs.static.outputs.launchers) }}
    env:
      L: ${{ matrix.launcher }}
      # A config key the browser's properties.json does not declare fails the
      # launch instead of being skipped: the driver may write only keys its
      # newest release reads. (Users get the lenient default; camouwolf always
      # rejects an unknown key.)
      CAMOUFOX_STRICT_CONFIG: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - id: browser
        uses: ./.github/actions/browser
        with:
          launcher: ${{ matrix.launcher }}
      - name: Point every launch at it
        env:
          EXECUTABLE: ${{ steps.browser.outputs.executable }}
        run: echo "${L^^}_EXECUTABLE_PATH=$EXECUTABLE" >> "$GITHUB_ENV"
      - name: The config schema is the browser release's (properties-one-schema)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/browser-release.py check-schema "$L" --tag "${{ steps.browser.outputs.tag }}"
      - name: Test prerequisites
        run: command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb; }
      - uses: ./.github/actions/node
      - name: The MCP server drives the browser
        working-directory: typescript/camoucore
        env:
          # Served as the launcher's bin serves it: `<launcher> mcp`.
          CAMOUCORE_MCP_LAUNCHER: ${{ matrix.launcher }}
          WAYLAND_DISPLAY: ""
        run: xvfb-run -a pnpm exec vitest run --project mcp tests/mcp/real-browser.test.ts
      - name: The packed drivers, installed clean, launch the browser
        run: |
          scripts/install-driver.sh "$L" "$RUNNER_TEMP/venv" "$RUNNER_TEMP/npm" geoip
          "$RUNNER_TEMP/venv/bin/python" -I scripts/smoke/smoke.py "$L"
          cp scripts/smoke/smoke.mjs scripts/smoke/page.html "$RUNNER_TEMP/npm/"
          node "$RUNNER_TEMP/npm/smoke.mjs" "$L"
      # release.yml stamps each launcher with the browser it was tested on.
      - name: Record the browser this run tested
        env:
          REPO: ${{ steps.browser.outputs.repo }}
          TAG: ${{ steps.browser.outputs.tag }}
        run: |
          mkdir -p .ci-work/tested
          jq -n --arg launcher "$L" --arg repo "$REPO" --arg tag "$TAG" '{$launcher, $repo, $tag}' > ".ci-work/tested/$L.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-browser-${{ matrix.launcher }}
          path: .ci-work/tested/${{ matrix.launcher }}.json
