name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: command -v xvfb-run >/dev/null || sudo apt-get install -y --no-install-recommends xvfb
      - run: python -m pip install -e 'python[geoip,captcha]' pytest
      - working-directory: python
        run: python -m pytest tests -q

  typescript:
    name: TypeScript
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15"
          cache: pnpm
      - run: command -v xvfb-run >/dev/null || sudo apt-get install -y --no-install-recommends xvfb
      - run: pnpm install --frozen-lockfile
      - working-directory: typescript
        run: pnpm typecheck && pnpm test && pnpm check
