name: tests

# Every package in this repository, in both languages, and each launcher's
# driver against its launcher's newest browser release. The browser ships
# first, then the driver: a driver change that needs a browser change waits for
# that browser's release, and the integration job says so by failing until it
# exists.
#
# The launchers are found, not listed: every python/<launcher> beside
# camoucore (AGENTS.md, "Adding a launcher").
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    outputs:
      launchers: ${{ steps.launchers.outputs.launchers }}
      packages: ${{ steps.launchers.outputs.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The oldest Python the packages support (python = "^3.11").
          python-version: "3.11"
      - id: launchers
        run: |
          launchers=$(cd python && ls -d */ | tr -d / | grep -vx camoucore | jq -R . | jq -cs .)
          echo "launchers=$launchers" >> "$GITHUB_OUTPUT"
          echo "packages=$(jq -c '["camoucore"] + .' <<<"$launchers")" >> "$GITHUB_OUTPUT"
          echo "launchers: $launchers"
      - name: Every package is at one version
        run: python3 scripts/set-version.py --check
      - name: The sources compile on the oldest supported Python
        run: python3 -m compileall -q python/*/src
      - name: No test input is git-ignored
        run: scripts/check-test-inputs.sh

  python:
    name: Python ${{ matrix.package }}
    needs: static
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.static.outputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test prerequisites
        # xvfb: the virtual-display lifecycle tests start servers of their own.
        run: command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb; }
      # geoip: camoucore's GeoIP source tests download every source and fail
      # when one stops publishing.
      - env:
          PKG: ${{ matrix.package }}
        run: |
          pkgs=("python/camoucore[geoip,captcha]")
          [ "$PKG" = camoucore ] || pkgs+=("python/$PKG[geoip,captcha]")
          python3 -m pip install -q -r python/requirements-dev.txt "${pkgs[@]/#/-e}"
      - uses: ./.github/actions/fpgen-model
      - name: pytest
        working-directory: python/${{ matrix.package }}
        env:
          # The drivers resolve releases through the GitHub API; anonymous, a
          # runner shares its IP range's 60-an-hour quota.
          GITHUB_TOKEN: ${{ github.token }}
        # A private display: nothing in the suite can reach a desktop.
        run: xvfb-run -a python3 -m pytest tests -q

  typescript:
    name: TypeScript ${{ matrix.package }}
    needs: static
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.static.outputs.packages) }}
    env:
      PKG: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The golden tests hold each TypeScript package to its Python twin's
          # output, recorded from this interpreter (<LAUNCHER>_PYTHON).
          python-version: "3.14"
      - name: The Python twin, for the goldens
        run: |
          python3 -m venv .venv
          pkgs=(-e python/camoucore)
          [ "$PKG" = camoucore ] || pkgs+=(-e "python/$PKG")
          .venv/bin/pip install -q -r python/requirements-dev.txt "${pkgs[@]}"
          echo "${PKG^^}_PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
      - uses: ./.github/actions/fpgen-model
        with:
          python: .venv/bin/python
      - name: Test prerequisites
        run: command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb; }
      - uses: ./.github/actions/node
      - name: Type check
        working-directory: typescript/${{ matrix.package }}
        run: pnpm typecheck
      - name: Lint
        working-directory: typescript/${{ matrix.package }}
        run: pnpm check
      - name: Build
        working-directory: typescript/${{ matrix.package }}
        run: pnpm build
      - name: The packed tarball installs, imports and ships every data file
        working-directory: typescript/${{ matrix.package }}
        run: |
          if jq -e '.scripts["check:pack"]' package.json >/dev/null; then pnpm check:pack
          else echo "$PKG has no check:pack"; fi
      - name: The recorded goldens match the Python launcher
        working-directory: typescript/${{ matrix.package }}
        run: |
          if ! jq -e '.scripts.golden' package.json >/dev/null; then echo "$PKG records no goldens"; exit 0; fi
          pnpm golden
          git diff --exit-code -- tests/golden || {
            echo "::error::typescript/$PKG/tests/golden is stale: the Python launcher's output changed. Run pnpm golden and commit, or mirror the change in TypeScript."
            exit 1
          }
      - name: vitest (golden tests included)
        working-directory: typescript/${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WAYLAND_DISPLAY: ""
        run: xvfb-run -a pnpm test

  mcp:
    name: MCP server
    needs: static
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/node
      - working-directory: mcp
        env:
          # The real-browser half runs in the integration job, which has a browser.
          CAMOUCORE_TEST_ALLOW_MISSING: CAMOUCORE_MCP_LAUNCHER
        run: pnpm typecheck && pnpm check && pnpm test

  install-driver:
    name: install-driver.sh ${{ matrix.launcher }}
    # What a browser repository's CI runs when its ci/driver-ref names a ref.
    needs: static
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        launcher: ${{ fromJSON(needs.static.outputs.launchers) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/node
      # The browser repositories call it with an npm directory even from a
      # Python-only job, and with or without extras.
      - name: Python and npm, with extras
        run: scripts/install-driver.sh ${{ matrix.launcher }} "$RUNNER_TEMP/venv" "$RUNNER_TEMP/npm" geoip
      - name: Python and npm, no extras
        run: scripts/install-driver.sh ${{ matrix.launcher }} "$RUNNER_TEMP/venv2" "$RUNNER_TEMP/npm2"
      - name: Python only, given an npm directory on a machine without node
        run: |
          python_dir=$(dirname "$(readlink -f "$(command -v python3)")")
          export PATH="$python_dir:/usr/bin:/bin"
          if command -v node; then echo "::error::node is still on PATH; this step tests a machine without it"; exit 1; fi
          scripts/install-driver.sh ${{ matrix.launcher }} "$RUNNER_TEMP/venv3" "$RUNNER_TEMP/npm3" | tee out.txt
          grep -q 'node is not on PATH' out.txt
          [ ! -e "$RUNNER_TEMP/npm3/node_modules" ]

  # -------------------------------------------------------------------------
  integration:
    name: ${{ matrix.launcher }} on its newest browser
    needs: [static, python, typescript, mcp]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        launcher: ${{ fromJSON(needs.static.outputs.launchers) }}
    env:
      L: ${{ matrix.launcher }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - id: browser
        uses: ./.github/actions/browser
        with:
          launcher: ${{ matrix.launcher }}
      - name: Point every launch at it
        env:
          EXECUTABLE: ${{ steps.browser.outputs.executable }}
        run: echo "${L^^}_EXECUTABLE_PATH=$EXECUTABLE" >> "$GITHUB_ENV"
      - name: The config schema is the browser release's (properties-one-schema)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/browser-release.py check-schema "$L" --tag "${{ steps.browser.outputs.tag }}"
      - name: Test prerequisites
        run: command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb; }
      - uses: ./.github/actions/node
      - name: The MCP server drives the browser
        working-directory: mcp
        env:
          # The launcher's npm package, which the MCP workspace depends on.
          CAMOUCORE_MCP_LAUNCHER: camoucore-${{ matrix.launcher }}
        run: xvfb-run -a pnpm exec vitest run tests/real-browser.test.ts
      - name: The packed drivers, installed clean, launch the browser
        run: |
          scripts/install-driver.sh "$L" "$RUNNER_TEMP/venv" "$RUNNER_TEMP/npm" geoip
          "$RUNNER_TEMP/venv/bin/python" -I scripts/smoke/smoke.py "$L"
          cp scripts/smoke/smoke.mjs scripts/smoke/page.html "$RUNNER_TEMP/npm/"
          node "$RUNNER_TEMP/npm/smoke.mjs" "$L"
      # release.yml stamps each launcher with the browser it was tested on.
      - name: Record the browser this run tested
        env:
          REPO: ${{ steps.browser.outputs.repo }}
          TAG: ${{ steps.browser.outputs.tag }}
        run: |
          mkdir -p .ci-work/tested
          jq -n --arg launcher "$L" --arg repo "$REPO" --arg tag "$TAG" '{$launcher, $repo, $tag}' > ".ci-work/tested/$L.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-browser-${{ matrix.launcher }}
          path: .ci-work/tested/${{ matrix.launcher }}.json
