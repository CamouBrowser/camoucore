name: Set up the pnpm workspace
description: >-
  Node, the workspace's pnpm, and a frozen install of the package in
  typescript/ (its lifecycle scripts build it).

inputs:
  node-version:
    description: Node version
    required: false
    default: "22.15"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        version: 10.33.4
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
