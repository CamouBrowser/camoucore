[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# One distribution: the core and every launcher built on it, as subpackages
# (camoucore.camoufox, camoucore.camouwolf). The `camoufox` and `camouwolf`
# names, their import packages and console scripts belong to the browser
# repositories' wrapper packages, which pin exactly one release of this one
# (RELEASING.md, "The wrapper packages").
name = "camoucore"
version = "0.6.1"
description = "The Camoufox and Camouwolf launchers and the core they share"
authors = ["JWriter20", "daijro <daijro.dev@gmail.com>"]
license = "MIT"
repository = "https://github.com/CamouBrowser/camoucore"
readme = "README.md"
packages = [{ include = "camoucore", from = "src" }]
keywords = [
    "client",
    "fingerprint",
    "browser",
    "scraping",
    "injector",
    "firefox",
    "chromium",
    "playwright",
]
classifiers = [
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
# 3.11: myuri (humanize) and its cursory need it, and 3.10 reached end of life
# in October 2026.
python = "^3.11"
requests = "*"
# requests reaches a socks5 proxy only with PySocks installed.
pysocks = "*"
rich = "*"
rich-click = "*"
pyyaml = "*"
platformdirs = "*"
typing_extensions = "*"
screeninfo = "*"
language-tags = "*"
numpy = "*"
orjson = "*"
inquirer = "*"
fpgen = "^1.3.0"
# Keep a ceiling. Every Playwright minor is free to change Juggler (1.61 added
# Juggler params camoufox's protocol schema had to learn), camouwolf.switches
# restates the --disable-features list of Playwright's Chromium launch
# (Chromium reads only the last one), and both launchers' server modules
# import playwright._impl._driver, a private API with no compat guarantee.
# Bump deliberately, with a run of `make -C browser tests` in camoufox and a
# check of chromiumSwitches against switches.PLAYWRIGHT_DISABLED_FEATURES.
playwright = "<1.63"
# camoufox reads the platform from a user agent with it.
ua_parser = "*"
# humanize's default engine. Pinned: a seed must plan the same input in Python and
# TypeScript, and in every install of one release.
myuri = "5.1.0"
maxminddb = {version = "*", optional = true}

[tool.poetry.extras]
geoip = ["maxminddb"]

[tool.pytest.ini_options]
# Test the in-tree package, whatever camoucore is installed. Each suite runs on
# its own (pytest tests/core, tests/camoufox, tests/camouwolf): each has its
# own conftest and imports its sibling test modules by name.
pythonpath = ["src"]
