[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "camoucore"
version = "0.1.1"
description = "The browser-independent core of the Camoufox and Camouwolf launchers"
authors = ["JWriter20", "daijro <daijro.dev@gmail.com>"]
license = "MIT"
repository = "https://github.com/CamoufoxCloud/camoucore"
readme = "README.md"
packages = [{ include = "camoucore", from = "src" }]
include = ["src/camoucore/*.json", "src/camoucore/*.yml", "src/camoucore/*.xml"]

[tool.poetry.dependencies]
python = "^3.11"
requests = "*"
rich = "*"
pyyaml = "*"
platformdirs = "*"
typing_extensions = "*"
screeninfo = "*"
language-tags = "*"
numpy = "*"
fpgen = "^1.3.0"
maxminddb = {version = "*", optional = true}

[tool.poetry.extras]
geoip = ["maxminddb"]

[tool.pytest.ini_options]
pythonpath = ["src"]
