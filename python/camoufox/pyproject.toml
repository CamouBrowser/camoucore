[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "camoufox"
version = "0.5.7"
description = "Wrapper around Playwright to help launch Camoufox"
authors = ["daijro <daijro.dev@gmail.com>"]
license = "MIT"
repository = "https://github.com/daijro/camoufox"
homepage = "https://camoufox.com/python"
readme = "README.md"
keywords = [
    "client",
    "fingerprint",
    "browser",
    "scraping",
    "injector",
    "firefox",
    "playwright",
]
classifiers = [
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
# 3.11: myuri (humanize) and its cursory need it, and 3.10 reached end of life
# in October 2026.
python = "^3.11"
# The launcher code camoufox shares with the other CamouBrowser launchers:
# downloads, GeoIP, locales, proxy lookups, Xvfb, the fpgen model pin, the
# defaults file, passthrough and telemetry. It brings fpgen, PyYAML,
# platformdirs, screeninfo, language-tags and PySocks with it. The captcha
# extra takes camoucore's, which brings the CaptchaKraken client.
camoucore = [
    {version = "^0.4.0"},
    {version = "^0.4.0", extras = ["captcha"], markers = "extra == 'captcha'"},
]
rich-click = "*"
# Imported directly by the Pro modules (camoucore brings it too).
platformdirs = "*"
rich = "*"
requests = "*"
orjson = "*"
# Keep a ceiling. 1.61 added Juggler params the protocol schema had to learn
# (viewport isMobile/screenSize, webp screenshots, webSocketFrame timestamps)
# and every Playwright minor is free to change Juggler again, while
# camoufox.server imports playwright._impl._driver -- a private API with no
# compat guarantee. Bump deliberately, with a run of `make -C browser tests`.
playwright = "<1.63"
numpy = "*"
ua_parser = "*"
typing_extensions = "*"
inquirer = "*"
# humanize's default engine. Pinned: a seed must plan the same input in Python and
# TypeScript, and in every install of one camoufox release.
myuri = "5.1.0"
maxminddb = {version = "*", optional = true}  # camoucore[geoip]
# Camoufox Pro profile state sync: XChaCha20-Poly1305, zstd, FastCDC.
pynacl = {version = ">=1.5", optional = true}
zstandard = {version = ">=0.22", optional = true}
pyfastcdc = {version = ">=0.3", optional = true}

[tool.poetry.extras]
geoip = ["maxminddb"]
# The captcha launch option's solver (camoucore[captcha]).
captcha = []
# A leased launch behind its own proxy, or of a stored profile, turns geoip on.
pro = ["maxminddb", "pynacl", "zstandard", "pyfastcdc"]

[tool.poetry.scripts]
camoufox = "camoufox.__main__:cli"

[tool.pytest.ini_options]
# Test the in-tree package, whatever camoufox is installed.
pythonpath = ["src"]
